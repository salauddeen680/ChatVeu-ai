<!DOCTYPE html>
<html lang="en" class="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>ChatVeu — AI Assistant</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = { darkMode: 'class', theme: { extend: { colors: { brand: { 500: '#2563eb', 600: '#1d4ed8' } } } } }
    </script>
    <script src="https://unpkg.com/lucide@latest" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js" crossorigin="anonymous"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/dompurify/3.0.6/purify.min.js" crossorigin="anonymous"></script>

    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
        html.dark body { background-color: #111827; color: #f3f4f6; }
        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-thumb { background: #d1d5db; border-radius: 4px; }
        html.dark ::-webkit-scrollbar-thumb { background: #4b5563; }
        
        #loading { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; background-color: #ffffff; z-index: 9999; flex-direction: column; gap: 1rem; transition: opacity 0.4s ease; }
        html.dark #loading { background-color: #111827; }
        .spinner { width: 36px; height: 36px; border: 4px solid #e5e7eb; border-top-color: #2563eb; border-radius: 50%; animation: spin 1s linear infinite; }
        html.dark .spinner { border-top-color: #3b82f6; }
        @keyframes spin { 100% { transform: rotate(360deg); } }

        .markdown-body p { margin-bottom: 0.75rem; line-height: 1.6; }
        .markdown-body pre { background-color: #1f2937; color: #e5e7eb; padding: 1rem; border-radius: 0.5rem; overflow-x: auto; }
        .markdown-body code { background-color: rgba(156,163,175,0.2); padding: 0.2rem 0.4rem; border-radius: 0.25rem; font-family: monospace; font-size: 0.875em; }
        
        .msg-user { background-color: #f3f4f6; color: #111827; border-radius: 1.5rem; border-bottom-right-radius: 0.5rem; padding: 0.75rem 1.25rem; max-width: 85%; margin-left: auto; word-wrap: break-word; }
        html.dark .msg-user { background-color: #374151; color: #f9fafb; }
        .msg-ai { max-width: 100%; padding: 0.25rem 0; word-wrap: break-word; overflow-x: hidden; }
        
        .typing-dot { width: 6px; height: 6px; background-color: #9ca3af; border-radius: 50%; display: inline-block; animation: bounce 1.4s infinite both; margin-right: 3px; }
        .typing-dot:nth-child(1) { animation-delay: -0.32s; }
        .typing-dot:nth-child(2) { animation-delay: -0.16s; }
        @keyframes bounce { 0%, 80%, 100% { transform: scale(0); } 40% { transform: scale(1); } }
        .mic-active { color: #ef4444 !important; animation: pulse-mic 1.5s infinite; }
        @keyframes pulse-mic { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.15); } }
    </style>
</head>
<body class="flex flex-col h-[100dvh] overflow-hidden bg-white dark:bg-gray-950">

    <!-- Loading -->
    <div id="loading">
        <div class="spinner"></div>
        <div id="loading-text" class="text-gray-700 dark:text-gray-300 font-medium">Loading ChatVeu...</div>
    </div>

    <!-- Main Layout -->
    <div id="app" class="flex flex-1 h-full w-full hidden opacity-0 transition-opacity duration-300">
        <!-- Sidebar Backdrop -->
        <div id="sidebar-backdrop" class="fixed inset-0 z-40 bg-black/50 hidden lg:hidden"></div>

        <!-- Sidebar -->
        <aside id="sidebar" class="fixed lg:static inset-y-0 left-0 z-50 w-72 bg-gray-50 dark:bg-gray-900 border-r border-gray-200 dark:border-gray-800 transform -translate-x-full lg:translate-x-0 transition-transform flex flex-col h-full">
            <div class="p-4 flex items-center justify-between">
                <h1 class="text-xl font-bold flex items-center gap-2 dark:text-white">
                    <svg viewBox="0 0 24 24" fill="none" class="w-7 h-7 text-brand-500"><path d="M12 2L2 7l10 5 10-5-10-5z" fill="currentColor"/><path d="M2 17l10 5 10-5M2 12l10 5 10-5" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
                    ChatVeu
                </h1>
                <button id="close-sidebar" class="p-2 lg:hidden dark:text-white"><i data-lucide="x"></i></button>
            </div>
            <div class="px-4 pb-2"><button id="new-chat-btn" class="w-full flex justify-center gap-2 py-2.5 bg-white dark:bg-gray-800 border rounded-xl font-medium dark:text-white dark:border-gray-700 shadow-sm"><i data-lucide="plus" class="w-4 h-4"></i> New Chat</button></div>
            <div class="flex-1 overflow-y-auto p-2 space-y-1" id="chat-list"></div>
            <div class="p-4 border-t border-gray-200 dark:border-gray-800"><button id="settings-btn" class="w-full flex items-center gap-3 px-3 py-2 rounded-lg font-medium dark:text-white"><i data-lucide="settings" class="w-4 h-4"></i> Settings</button></div>
        </aside>

        <!-- Chat Area -->
        <main class="flex-1 flex flex-col h-full relative">
            <header class="h-14 flex items-center justify-between px-4 border-b dark:border-gray-800 shrink-0">
                <div class="flex items-center gap-3">
                    <button id="open-sidebar" class="p-2 -ml-2 lg:hidden dark:text-white"><i data-lucide="menu"></i></button>
                    <h2 id="current-chat-title" class="font-medium dark:text-white truncate">New Chat</h2>
                </div>
                <button id="voice-toggle-btn" class="p-2 text-gray-400"><i data-lucide="volume-x" id="voice-icon"></i></button>
            </header>

            <div id="chat-container" class="flex-1 overflow-y-auto px-4 py-6">
                <div id="empty-state" class="flex flex-col items-center justify-center text-center mt-10">
                    <div class="w-16 h-16 bg-blue-50 dark:bg-brand-900/20 rounded-2xl flex items-center justify-center mb-4 text-brand-500"><svg viewBox="0 0 24 24" fill="none" class="w-8 h-8"><path d="M12 2L2 7l10 5 10-5-10-5z" fill="currentColor"/><path d="M2 17l10 5 10-5M2 12l10 5 10-5" stroke="currentColor" stroke-width="2"/></svg></div>
                    <h2 class="text-xl font-semibold dark:text-white mb-2">How can I help?</h2>
                    <p class="text-gray-500 dark:text-gray-400 text-sm">Tap the mic or type a message.</p>
                </div>
                <div id="messages-wrapper" class="flex flex-col gap-6 max-w-4xl mx-auto pb-4"></div>
            </div>

            <!-- Input Box -->
            <div class="p-4 shrink-0 pb-[calc(1rem+var(--safe-area-inset-bottom))] bg-white dark:bg-gray-950">
                <div class="max-w-3xl mx-auto relative rounded-2xl border dark:border-gray-700 bg-white dark:bg-gray-900 shadow-sm focus-within:ring-2 focus-within:ring-brand-500">
                    <div id="error-toast" class="hidden text-xs text-red-500 px-4 pt-2 font-medium"></div>
                    <textarea id="message-input" rows="1" class="w-full bg-transparent border-0 px-4 py-3.5 pr-24 dark:text-white placeholder-gray-500 focus:outline-none resize-none" placeholder="Message ChatVeu..."></textarea>
                    <div class="absolute right-2 bottom-2 flex items-center gap-1">
                        <button id="mic-btn" class="p-2 rounded-full text-gray-400 hover:bg-gray-100 dark:hover:bg-gray-800"><i data-lucide="mic" class="w-5 h-5"></i></button>
                        <button id="send-btn" class="p-1.5 rounded-lg bg-brand-500 text-white disabled:opacity-50"><i data-lucide="arrow-up" class="w-5 h-5"></i></button>
                        <button id="stop-btn" class="hidden p-1.5 rounded-lg bg-red-500 text-white"><i data-lucide="square" class="w-5 h-5 fill-current"></i></button>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <!-- Settings Modal -->
    <div id="settings-modal" class="fixed inset-0 z-[100] hidden items-center justify-center">
        <div class="fixed inset-0 bg-black/50" id="settings-backdrop"></div>
        <div class="relative bg-white dark:bg-gray-900 rounded-2xl shadow-xl w-full max-w-md mx-4 flex flex-col border dark:border-gray-800">
            <div class="flex items-center justify-between p-4 border-b dark:border-gray-800">
                <h3 class="text-lg font-semibold dark:text-white">Settings</h3>
                <button id="close-settings" class="p-1 dark:text-white"><i data-lucide="x"></i></button>
            </div>
            <div class="p-4 space-y-4">
                <div><label class="block text-sm mb-1 dark:text-gray-200">Gemini API Key</label><input type="password" id="api-key-input" class="w-full bg-gray-50 dark:bg-gray-800 border rounded-lg px-3 py-2 text-sm dark:text-white dark:border-gray-700"></div>
                <div><label class="block text-sm mb-1 dark:text-gray-200">Model Name</label><input type="text" id="model-input" value="gemini-2.5-flash" class="w-full bg-gray-50 dark:bg-gray-800 border rounded-lg px-3 py-2 text-sm dark:text-white dark:border-gray-700"></div>
                <div><label class="block text-sm mb-1 dark:text-gray-200">Theme</label><select id="theme-select" class="w-full bg-gray-50 dark:bg-gray-800 border rounded-lg px-3 py-2 text-sm dark:text-white dark:border-gray-700"><option value="system">System</option><option value="light">Light</option><option value="dark">Dark</option></select></div>
            </div>
            <div class="p-4 border-t dark:border-gray-800 flex justify-end gap-2">
                <button id="save-settings-btn" class="px-4 py-2 text-sm text-white bg-brand-600 rounded-lg">Save</button>
            </div>
        </div>
    </div>

    <script>
        const AppState = { apiKey: '', modelName: 'gemini-2.5-flash', theme: 'system', chats: {}, currentChatId: null, isGenerating: false, abortController: null, voiceEnabled: false, isListening: false };
        const els = {};
        
        // Voice Setup
        const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
        let recognition = SpeechRecognition ? new SpeechRecognition() : null;
        if(recognition) { recognition.continuous = false; recognition.interimResults = true; recognition.lang = 'hi-IN'; } // Set to Hindi/Hinglish

        window.onload = () => {
            ['app', 'loading', 'sidebar', 'sidebar-backdrop', 'open-sidebar', 'close-sidebar', 'chat-list', 'new-chat-btn', 'chat-container', 'empty-state', 'messages-wrapper', 'current-chat-title', 'message-input', 'send-btn', 'stop-btn', 'mic-btn', 'voice-toggle-btn', 'voice-icon', 'error-toast', 'settings-btn', 'settings-modal', 'close-settings', 'settings-backdrop', 'api-key-input', 'model-input', 'theme-select', 'save-settings-btn'].forEach(id => els[id] = document.getElementById(id));
            if (typeof lucide !== 'undefined') lucide.createIcons();
            loadStorage();
            applyTheme(AppState.theme);
            const ids = Object.keys(AppState.chats).sort((a,b) => AppState.chats[b].updatedAt - AppState.chats[a].updatedAt);
            ids.length > 0 ? loadChat(ids[0]) : createNewChat();
            setupEvents();
            setupVoice();
            els['loading'].style.opacity = '0'; setTimeout(() => { els['loading'].style.display = 'none'; els['app'].classList.remove('hidden'); setTimeout(() => els['app'].classList.remove('opacity-0'), 50); }, 300);
        };

        function loadStorage() {
            try {
                AppState.apiKey = localStorage.getItem('chatveu_apiKey') || '';
                AppState.modelName = localStorage.getItem('chatveu_modelName') || 'gemini-2.5-flash';
                AppState.theme = localStorage.getItem('chatveu_theme') || 'system';
                AppState.chats = JSON.parse(localStorage.getItem('chatveu_chats')) || {};
            } catch(e) { AppState.chats = {}; }
        }

        function saveStorage() {
            localStorage.setItem('chatveu_apiKey', AppState.apiKey);
            localStorage.setItem('chatveu_modelName', AppState.modelName);
            localStorage.setItem('chatveu_theme', AppState.theme);
            localStorage.setItem('chatveu_chats', JSON.stringify(AppState.chats));
        }

        function applyTheme(theme) {
            if (theme === 'dark' || (theme === 'system' && window.matchMedia('(prefers-color-scheme: dark)').matches)) document.documentElement.classList.add('dark');
            else document.documentElement.classList.remove('dark');
        }

        function sanitizeHTML(text) { return text.replace(/[&<>'"]/g, t => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', "'": '&#39;', '"': '&quot;' }[t])); }
        function parseMD(text) { try { return DOMPurify.sanitize(marked.parse(text)); } catch(e) { return sanitizeHTML(text); } }

        function createNewChat() {
            const id = Date.now().toString();
            AppState.chats[id] = { id, title: 'New Chat', messages: [], updatedAt: Date.now() };
            saveStorage(); loadChat(id); if (window.innerWidth < 1024) toggleMenu(false);
        }

        function loadChat(id) {
            if (!AppState.chats[id]) return;
            if (AppState.isGenerating) stopGen();
            window.speechSynthesis?.cancel();
            AppState.currentChatId = id;
            els['current-chat-title'].textContent = AppState.chats[id].title;
            els['messages-wrapper'].innerHTML = '';
            if (AppState.chats[id].messages.length === 0) els['empty-state'].classList.remove('hidden');
            else { els['empty-state'].classList.add('hidden'); AppState.chats[id].messages.forEach(m => appendMsg(m.role, m.text)); }
            els['chat-container'].scrollTop = els['chat-container'].scrollHeight;
            renderList(); updateUI();
        }

        function renderList() {
            els['chat-list'].innerHTML = Object.values(AppState.chats).sort((a,b)=>b.updatedAt - a.updatedAt).map(c => 
                `<div class="flex items-center justify-between p-2.5 rounded-lg cursor-pointer ${c.id === AppState.currentChatId ? 'bg-gray-200 dark:bg-gray-800' : 'hover:bg-gray-100 dark:hover:bg-gray-800/50'}" onclick="loadChat('${c.id}')"><span class="text-sm truncate dark:text-white">${sanitizeHTML(c.title)}</span></div>`
            ).join('');
        }

        function appendMsg(role, text) {
            const div = document.createElement('div');
            div.className = 'flex w-full animate-fade-in-up';
            if(role === 'user') div.innerHTML = `<div class="msg-user text-sm sm:text-base">${sanitizeHTML(text)}</div>`;
            else div.innerHTML = `<div class="flex gap-3 w-full"><div class="w-8 h-8 rounded-full bg-brand-100 dark:bg-brand-900/30 flex items-center justify-center shrink-0 mt-1 text-brand-600"><svg viewBox="0 0 24 24" fill="none" class="w-4 h-4"><path d="M12 2L2 7l10 5 10-5-10-5z" fill="currentColor"/></svg></div><div class="msg-ai markdown-body flex-1 text-sm sm:text-base dark:text-gray-100">${parseMD(text)}</div></div>`;
            els['messages-wrapper'].appendChild(div);
            return div;
        }

        function toggleMenu(show) {
            if(show) { els['sidebar'].classList.remove('-translate-x-full'); els['sidebar-backdrop'].classList.remove('hidden'); }
            else { els['sidebar'].classList.add('-translate-x-full'); els['sidebar-backdrop'].classList.add('hidden'); }
        }

        function updateUI() {
            const hasT = els['message-input'].value.trim().length > 0;
            els['send-btn'].disabled = !hasT || AppState.isGenerating;
            if (AppState.isGenerating) { els['send-btn'].classList.add('hidden'); els['stop-btn'].classList.remove('hidden'); els['mic-btn'].classList.add('hidden'); els['message-input'].disabled = true; }
            else { els['send-btn'].classList.remove('hidden'); els['stop-btn'].classList.add('hidden'); els['mic-btn'].classList.remove('hidden'); els['message-input'].disabled = false; }
            els['error-toast'].classList.add('hidden');
        }

        // Fix for 400/500 API Errors: Strict Payload Sanitizer
        function buildPayload(messages) {
            let valid = [];
            let lastR = null;
            messages.forEach(m => {
                let t = (m.text || '').trim();
                if(!t) return; // Skip empty
                let r = m.role === 'user' ? 'user' : 'model';
                if(r === lastR) { valid[valid.length-1].parts[0].text += '\n' + t; } // Merge consecutive
                else { valid.push({ role: r, parts: [{text: t}] }); lastR = r; }
            });
            return { contents: valid };
        }

        async function sendMsg() {
            const text = els['message-input'].value.trim();
            if (!text || AppState.isGenerating) return;
            if (!AppState.apiKey) { openSet(); return; }
            
            window.speechSynthesis?.cancel();
            els['message-input'].value = '';
            const chat = AppState.chats[AppState.currentChatId];
            if (chat.messages.length === 0) { chat.title = text.substring(0, 30) + '...'; els['current-chat-title'].textContent = chat.title; }
            
            chat.messages.push({ role: 'user', text }); chat.updatedAt = Date.now(); saveStorage();
            appendMsg('user', text); els['empty-state'].classList.add('hidden');
            updateUI(); els['chat-container'].scrollTop = els['chat-container'].scrollHeight;
            
            AppState.isGenerating = true; updateUI();
            const aiDiv = document.createElement('div'); aiDiv.className = 'flex w-full gap-3';
            aiDiv.innerHTML = `<div class="w-8 h-8 rounded-full bg-brand-100 flex items-center justify-center shrink-0 mt-1 text-brand-600"><svg class="w-4 h-4 animate-pulse" viewBox="0 0 24 24" fill="none"><path d="M12 2L2 7l10 5 10-5-10-5z" fill="currentColor"/></svg></div><div class="msg-ai markdown-body flex-1 dark:text-gray-100"><div class="typing-dot"></div><div class="typing-dot"></div><div class="typing-dot"></div></div>`;
            els['messages-wrapper'].appendChild(aiDiv); els['chat-container'].scrollTop = els['chat-container'].scrollHeight;
            const tCont = aiDiv.querySelector('.msg-ai');
            
            let fullT = ''; AppState.abortController = new AbortController();
            try {
                const payload = buildPayload(chat.messages);
                const res = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/${AppState.modelName}:streamGenerateContent?alt=sse`, {
                    method: 'POST', headers: { 'x-goog-api-key': AppState.apiKey, 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload), signal: AppState.abortController.signal
                });
                if (!res.ok) throw new Error(`HTTP ${res.status}`);
                
                const reader = res.body.getReader(); const decoder = new TextDecoder(); let buf = ''; tCont.innerHTML = ''; 
                while(true) {
                    const { done, value } = await reader.read(); if(done) break;
                    buf += decoder.decode(value, {stream: true}); const lines = buf.split('\n'); buf = lines.pop();
                    for(let l of lines) {
                        if(l.startsWith('data: ')) {
                            const d = l.slice(6).trim(); if(!d) continue;
                            try { const c = JSON.parse(d).candidates?.[0]?.content?.parts?.[0]?.text; if(c) { fullT += c; tCont.innerHTML = parseMD(fullT); els['chat-container'].scrollTop = els['chat-container'].scrollHeight; } } catch(e){}
                        }
                    }
                }
                if(!fullT) throw new Error("Empty AI response.");
                if(AppState.voiceEnabled && window.speechSynthesis) { const u = new SpeechSynthesisUtterance(fullT.replace(/[*_~`#]/g, '')); u.lang='en-IN'; window.speechSynthesis.speak(u); }
            } catch(e) {
                if (e.name === 'AbortError') fullT += '\n*(Stopped)*'; else { fullT += `\n**Error:** ${e.message}`; els['error-toast'].textContent = 'API Error'; els['error-toast'].classList.remove('hidden'); }
                tCont.innerHTML = parseMD(fullT);
            } finally {
                AppState.isGenerating = false; chat.messages.push({ role: 'model', text: fullT }); chat.updatedAt = Date.now(); saveStorage(); updateUI(); renderList();
            }
        }

        function stopGen() { AppState.abortController?.abort(); window.speechSynthesis?.cancel(); }
        function openSet() { els['api-key-input'].value = AppState.apiKey; els['model-input'].value = AppState.modelName; els['theme-select'].value = AppState.theme; els['settings-modal'].classList.remove('hidden'); els['settings-modal'].classList.add('flex'); }

        function setupVoice() {
            els['voice-toggle-btn'].onclick = () => { AppState.voiceEnabled = !AppState.voiceEnabled; els['voice-icon'].setAttribute('data-lucide', AppState.voiceEnabled ? 'volume-2' : 'volume-x'); els['voice-toggle-btn'].className = AppState.voiceEnabled ? 'p-2 text-brand-500' : 'p-2 text-gray-400'; lucide.createIcons({root: els['voice-toggle-btn']}); window.speechSynthesis?.cancel(); };
            if(!recognition) { els['mic-btn'].style.display='none'; return; }
            recognition.onstart = () => { AppState.isListening = true; els['mic-btn'].classList.add('mic-active'); els['message-input'].placeholder = "Listening..."; window.speechSynthesis?.cancel(); };
            recognition.onresult = (e) => { let txt = ''; for(let i=e.resultIndex; i<e.results.length; ++i) txt += e.results[i][0].transcript; els['message-input'].value = txt; updateUI(); };
            recognition.onend = () => { AppState.isListening = false; els['mic-btn'].classList.remove('mic-active'); els['message-input'].placeholder = "Message ChatVeu..."; if (els['message-input'].value.trim() && !AppState.isGenerating) sendMsg(); };
            els['mic-btn'].onclick = () => { AppState.isListening ? recognition.stop() : recognition.start(); };
        }

        function setupEvents() {
            els['open-sidebar'].onclick = () => toggleMenu(true);
            els['close-sidebar'].onclick = els['sidebar-backdrop'].onclick = () => toggleMenu(false);
            els['new-chat-btn'].onclick = createNewChat;
            els['settings-btn'].onclick = openSet;
            els['close-settings'].onclick = els['settings-backdrop'].onclick = () => { els['settings-modal'].classList.add('hidden'); els['settings-modal'].classList.remove('flex'); };
            els['save-settings-btn'].onclick = () => { AppState.apiKey = els['api-key-input'].value; AppState.modelName = els['model-input'].value; AppState.theme = els['theme-select'].value; saveStorage(); applyTheme(AppState.theme); els['settings-modal'].classList.add('hidden'); };
            els['message-input'].oninput = updateUI;
            els['message-input'].onkeydown = (e) => { if(e.key==='Enter' && !e.shiftKey) { e.preventDefault(); sendMsg(); } };
            els['send-btn'].onclick = sendMsg; els['stop-btn'].onclick = stopGen;
        }
    </script>
</body>
</html>
