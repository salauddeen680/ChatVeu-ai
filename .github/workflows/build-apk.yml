name: Auto Build Android APK

on:
  workflow_dispatch: # Mobile se manual button dabane ke liye

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Install Capacitor & Create Android Project
        run: |
          npm init -y
          npm install @capacitor/core @capacitor/android
          npm install -D @capacitor/cli @capacitor/assets
          npx cap init ChatVeu com.chatveu.app --web-dir .
          npx cap add android

      - name: Add Mic Permissions Automatically
        run: |
          # Yeh script khud AndroidManifest.xml mein voice permissions daal degi
          sed -i '/<application/i \    <uses-permission android:name="android.permission.RECORD_AUDIO" />\n    <uses-permission android:name="android.permission.MODIFY_AUDIO_SETTINGS" />' android/app/src/main/AndroidManifest.xml

      - name: Set Custom Logo (Agar logo.png upload kiya hai)
        run: |
          if [ -f "logo.png" ]; then
            echo "Custom logo mil gaya! Set kar raha hoon..."
            mkdir -p assets
            cp logo.png assets/icon.png
            npx @capacitor/assets generate --icon
          else
            echo "logo.png nahi mila, default logo use ho raha hai."
          fi

      - name: Build Debug APK
        run: |
          npx cap sync android
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload Ready APK
        uses: actions/upload-artifact@v4
        with:
          name: ChatVeu-Voice-App
          path: android/app/build/outputs/apk/debug/app-debug.apk
          
