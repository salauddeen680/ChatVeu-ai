name: Build Android APK Manually

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Create Web Directory & Copy Files
        run: |
          mkdir -p www
          cp index.html www/
          if [ -f "logo.png" ]; then cp logo.png www/; fi

      - name: Install Dependencies
        run: |
          npm init -y
          npm install @capacitor/core @capacitor/android
          npm install -D @capacitor/cli @capacitor/assets

      - name: Initialize Capacitor
        run: |
          npx cap init ChatVeu com.chatveu.app --web-dir www
          npx cap add android

      - name: Add Android Permissions
        run: |
          sed -i '/<application/i \    <uses-permission android:name="android.permission.RECORD_AUDIO" />\n    <uses-permission android:name="android.permission.MODIFY_AUDIO_SETTINGS" />' android/app/src/main/AndroidManifest.xml

      - name: Set Custom Logo
        run: |
          if [ -f "logo.png" ]; then
            echo "Custom logo found!"
            mkdir -p assets
            cp logo.png assets/icon.png
            cp logo.png assets/splash.png
            npx @capacitor/assets generate --android
          fi

      # यह स्टेप Kotlin के Duplicate एरर को हमेशा के लिए जड़ से खत्म कर देगा
      - name: Fix Kotlin Duplicate Class Error
        run: |
          cat <<EOF >> android/app/build.gradle
          
          configurations.all {
              resolutionStrategy {
                  exclude group: 'org.jetbrains.kotlin', module: 'kotlin-stdlib-jdk7'
                  exclude group: 'org.jetbrains.kotlin', module: 'kotlin-stdlib-jdk8'
              }
          }
          EOF

      - name: Build APK
        run: |
          npx cap sync android
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload Final APK
        uses: actions/upload-artifact@v4
        with:
          name: ChatVeu-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          
