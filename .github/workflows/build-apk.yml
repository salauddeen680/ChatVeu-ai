
name: Build Capacitor Android APK

# Workflow kab chalega? (Code push karne par aur manually button dabane par)
on:
  push:
    branches:
      - main
  workflow_dispatch:

# GitHub ko code read/write karne ki permission
permissions:
  contents: write

jobs:
  build-apk:
    name: Build APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20' # Capacitor ke liye Node.js zaroori hai

      - name: Install NPM Dependencies & Sync Capacitor
        run: |
          npm install
          npx cap sync android

      - name: Setup Java JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Make Gradlew Executable
        working-directory: ./android
        run: chmod +x gradlew

      - name: Build Android Debug APK
        working-directory: ./android
        run: ./gradlew assembleDebug

      - name: Upload APK to GitHub Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ChatVeu-App-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
